    // --- THREE.JS BACKGROUND COMPONENT ---
    const ThreeBackground = () => {
      const mountRef = useRef(null);

      useEffect(() => {
        let scene, camera, renderer, particles, animationFrameId;
        const container = mountRef.current;
        if (!container) return;

        // Initialize Scene
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Particle System
        const particleCount = 120;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
          positions[i] = (Math.random() - 0.5) * 60;
          positions[i + 1] = (Math.random() - 0.5) * 60;
          positions[i + 2] = (Math.random() - 0.5) * 60;

          // Subtle cyan/accent color mix
          colors[i] = 0.04;     // R
          colors[i + 1] = 0.51; // G
          colors[i + 2] = 1.0;  // B
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
          size: 0.8,
          vertexColors: true,
          transparent: true,
          opacity: 0.4
        });

        particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // Mouse Parallax Interaction
        let mouseX = 0;
        let mouseY = 0;

        const handleMouseMove = (event) => {
          mouseX = (event.clientX / window.innerWidth - 0.5) * 2;
          mouseY = (event.clientY / window.innerHeight - 0.5) * 2;
        };

        window.addEventListener('mousemove', handleMouseMove);

        const handleResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };

        window.addEventListener('resize', handleResize);

        // Animation Loop
        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);

          particles.rotation.x += 0.0005;
          particles.rotation.y += 0.0008;

          // Smooth camera swing following mouse
          camera.position.x += (mouseX * 3 - camera.position.x) * 0.02;
          camera.position.y += (-mouseY * 3 - camera.position.y) * 0.02;
          camera.lookAt(scene.position);

          renderer.render(scene, camera);
        };

        animate();

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
          if (container && renderer.domElement) {
            container.removeChild(renderer.domElement);
          }
        };
      }, []);

      return <div ref={mountRef} className="fixed inset-0 pointer-events-none z-0" />;
    };

                        target="_blank"
                        rel="noreferrer"
                        className="flex-1 py-3 rounded-xl glass-card text-center text-xs font-semibold text-white hover:border-accent transition-colors flex items-center justify-center gap-2"
                      >
                        <Icon name="github" className="w-4 h-4" />
                        GitHub
                      </a>
                      <a
                        href="#"
                        className="flex-1 py-3 rounded-xl glass-card text-center text-xs font-semibold text-white hover:border-accent transition-colors flex items-center justify-center gap-2"
                      >
                        <Icon name="linkedin" className="w-4 h-4 text-accent" />
                        LinkedIn
                      </a>
                    </div>
                  </div>

                  {/* Right Interactive Contact Form */}
                  <div className="lg:col-span-7 glass-card p-8 rounded-2xl relative">
                    <form onSubmit={(e) => { e.preventDefault(); alert("Thank you! Your message has been sent successfully."); }} className="flex flex-col gap-6">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                          <label className="block text-xs font-mono text-secText mb-2 uppercase">Your Name</label>
                          <input
                            type="text"
                            required
                            placeholder="John Doe"
                            className="w-full px-4 py-3 rounded-xl bg-bgDark border border-borderDark text-sm text-white focus:outline-none focus:border-accent transition-colors"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-mono text-secText mb-2 uppercase">Your Email</label>
                          <input
                            type="email"
                            required
                            placeholder="john@example.com"
                            className="w-full px-4 py-3 rounded-xl bg-bgDark border border-borderDark text-sm text-white focus:outline-none focus:border-accent transition-colors"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-mono text-secText mb-2 uppercase">Subject</label>
                        <input
                          type="text"
                          required
                          placeholder="Internship / Business Proposal / Collaboration"
                          className="w-full px-4 py-3 rounded-xl bg-bgDark border border-borderDark text-sm text-white focus:outline-none focus:border-accent transition-colors"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-mono text-secText mb-2 uppercase">Message</label>
                        <textarea
                          rows="5"
                          required
                          placeholder="Write your message here..."
                          className="w-full px-4 py-3 rounded-xl bg-bgDark border border-borderDark text-sm text-white focus:outline-none focus:border-accent transition-colors resize-none"
                        ></textarea>
                      </div>

                      <button
                        type="submit"
                        className="w-full py-4 rounded-xl bg-accent hover:bg-accentHover text-white font-semibold text-sm transition-all duration-300 shadow-lg shadow-accent/20 flex items-center justify-center gap-2"
                      >
                        <Icon name="send" className="w-4 h-4" />
                        <span>Send Message</span>
                      </button>
                    </form>
                  </div>

                </div>
              </div>
            </section>

          </main>

          {/* FOOTER */}
          <footer className="border-t border-borderDark py-12 px-6 bg-bgDark relative z-10 text-xs font-mono text-secText">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg bg-cardDark border border-borderDark flex items-center justify-center font-space font-bold text-accent">
                  MH
                </div>
                <div>
                  <div className="text-white font-semibold font-geist">MD MARUFUL HOQUE</div>
                  <div className="text-[10px]">Business Management & Tech Hybrid</div>
                </div>
              </div>

              <div className="text-center md:text-right">
                <p>© {new Date().getFullYear()} MD MARUFUL HOQUE. All rights reserved.</p>
                <p className="mt-1 text-[10px] text-secText/70">Designed with Apple & Linear Design Language</p>
              </div>
            </div>
          </footer>

        </div>
      );
    };

    // Render App to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
